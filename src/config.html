<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Impressoras</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, Segoe UI, sans-serif; margin: 0; padding: 20px; color: #231F20; background: #fff; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  p.ajuda { font-size: 12px; color: #666; margin: 0 0 16px; line-height: 1.4; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; color: #666; padding: 0 0 6px; }
  td { padding: 5px 0; border-top: 1px solid #eee; vertical-align: middle; }
  td.nome { padding-right: 10px; }
  .padrao { font-size: 11px; color: #666; }
  select { width: 100%; height: 30px; font-size: 13px; padding: 0 4px; }
  .rodape { margin-top: 20px; display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
  button { height: 34px; padding: 0 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f5f5f5; }
  /* A cor vem da MARCA (var setada no carregar()); o verde é só o fallback de
     quando o build não rodou o gerar-icone.ps1. */
  button.ok { background: var(--marca, #219790); border-color: var(--marca, #219790); color: #fff; font-weight: 700; }
  h1 { color: var(--marca, #231F20); }
  .vazio { font-size: 13px; color: #666; padding: 16px 0; }
</style>
</head>
<body>
  <h1>Impressoras deste computador</h1>
  <p class="ajuda">
    Diga que tipo de papel está em cada impressora. O recibo e o orçamento vão para a
    do <strong>cupom</strong>; relatórios vão para a de <strong>A4</strong>. Impressora
    marcada como "Não usar" nunca recebe nada do Gestor.
  </p>

  <table>
    <thead>
      <tr><th>Impressora</th><th style="width:200px;">Papel</th></tr>
    </thead>
    <tbody id="linhas"></tbody>
  </table>
  <div class="vazio" id="vazio" hidden>Nenhuma impressora encontrada neste computador.</div>

  <div class="rodape">
    <button onclick="window.close()">Fechar</button>
    <button class="ok" id="salvar">Salvar</button>
  </div>

<script>
  const ROTULOS = { cupom: 'Cupom (bobina)', a4: 'A4 (folha)' };
  const linhas = document.getElementById('linhas');

  async function vestirMarca() {
    // Best-effort: sem marca assada no build, o CSS fica no fallback e a tela
    // funciona igual. Config de impressora não pode falhar por causa de cor.
    try {
      const { primaria } = await window.alfaclubDesktop.marca();
      if (primaria) document.documentElement.style.setProperty('--marca', primaria);
    } catch { /* fallback do CSS */ }
  }

  async function carregar() {
    const { impressoras, papeis, tipos } = await window.alfaclubDesktop.listarImpressoras();
    document.getElementById('vazio').hidden = impressoras.length > 0;

    linhas.innerHTML = '';
    impressoras.forEach((imp) => {
      const tr = document.createElement('tr');

      const tdNome = document.createElement('td');
      tdNome.className = 'nome';
      tdNome.textContent = imp.nome;
      if (imp.padrao) {
        const marca = document.createElement('div');
        marca.className = 'padrao';
        marca.textContent = 'padrão do Windows';
        tdNome.append(marca);
      }

      const select = document.createElement('select');
      select.dataset.impressora = imp.nome;
      // "Não usar" é o estado inicial honesto: sem classificação o app cai na
      // impressora padrão do Windows, que é o comportamento antigo.
      select.append(new Option('Não usar', ''));
      tipos.forEach((t) => select.append(new Option(ROTULOS[t] || t, t)));
      select.value = papeis[imp.nome] || '';

      const tdPapel = document.createElement('td');
      tdPapel.append(select);
      tr.append(tdNome, tdPapel);
      linhas.append(tr);
    });
  }

  document.getElementById('salvar').addEventListener('click', async () => {
    const mapa = {};
    linhas.querySelectorAll('select').forEach((s) => {
      if (s.value) mapa[s.dataset.impressora] = s.value;
    });
    await window.alfaclubDesktop.salvarPapeis(mapa);
    // Fecha DEPOIS do await: fechar antes mataria a janela com o IPC no meio do
    // caminho e a escolha do operador nao chegaria ao disco.
    window.close();
  });

  vestirMarca();
  carregar();
</script>
</body>
</html>
